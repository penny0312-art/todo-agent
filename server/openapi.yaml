openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出任务，包括已完成任务；可按截止日期过滤
      parameters:
        - name: dueDate
          in: query
          required: false
          description: 可选的截止日期过滤，格式为 YYYY-MM-DD
          schema: { $ref: "#/components/schemas/DueDate" }
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createTask
      summary: 创建一条未完成的顶级任务或一层子任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                priority: { $ref: "#/components/schemas/Priority" }
                effort: { $ref: "#/components/schemas/Effort" }
                dueDate:
                  oneOf:
                    - { $ref: "#/components/schemas/DueDate" }
                    - { type: "null" }
                parentId:
                  description: 可选的父任务 ID；null 或省略表示顶级任务
                  oneOf:
                    - { type: string }
                    - { type: "null" }
                estimatedMinutes:
                  description: 可选预计耗时，正整数分钟；null 表示未知
                  oneOf:
                    - { type: integer, minimum: 1 }
                    - { type: "null" }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态、优先级、工作量、截止日期或父任务关系
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                priority: { $ref: "#/components/schemas/Priority" }
                effort: { $ref: "#/components/schemas/Effort" }
                dueDate:
                  oneOf:
                    - { $ref: "#/components/schemas/DueDate" }
                    - { type: "null" }
                parentId:
                  description: 父任务 ID；null 用于将子任务移为顶级任务
                  oneOf:
                    - { type: string }
                    - { type: "null" }
                estimatedMinutes:
                  description: 预计耗时，正整数分钟；null 用于清除
                  oneOf:
                    - { type: integer, minimum: 1 }
                    - { type: "null" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    Priority:
      type: string
      enum: [low, medium, high]
      default: medium
      description: 任务优先级，分别表示低、中、高
    Effort:
      type: string
      enum: [small, medium, large]
      default: medium
      description: 工作量等级，分别表示小、中、大
    DueDate:
      type: string
      format: date
      description: Asia/Shanghai 时区下的日历日期，格式为 YYYY-MM-DD
    Task:
      type: object
      required: [id, title, done, priority, effort, dueDate, parentId, estimatedMinutes, createdAt, completedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        priority: { $ref: "#/components/schemas/Priority" }
        effort: { $ref: "#/components/schemas/Effort" }
        dueDate:
          oneOf:
            - { $ref: "#/components/schemas/DueDate" }
            - { type: "null" }
        parentId:
          description: 父任务 ID；null 表示顶级任务
          oneOf:
            - { type: string }
            - { type: "null" }
        estimatedMinutes:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        createdAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        completedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        updatedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 操作违反父子任务业务规则
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
